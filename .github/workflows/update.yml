name: Update sprites

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if SpriteCollab is unchanged
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - convert.py
      - build.py
      - requirements.txt
      - README.md
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: sprite-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Check SpriteCollab and publish changed exports
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_REBUILD: ${{ inputs.force || false }}
        run: |
          if [ "$FORCE_REBUILD" = "true" ]; then
            python build.py --force
          else
            python build.py
          fi
